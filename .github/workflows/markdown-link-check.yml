name: Check Markdown links

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 6 * * 0'  # At 06:13 on Sunday — https://crontab.guru/#13_6_*_*_0

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'